<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #111;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 13px;
  }

  /* NAV */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid #e8e8e8;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 99;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .nav-name {
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    color: #111;
    letter-spacing: 0.01em;
  }
  .nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
  }
  .nav-links a {
    font-size: 12px;
    color: #111;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 0.5; }
  .nav-links a.active { border-bottom: 1px solid #111; }

  .subnav {
    display: none;
  }

  .nav-links li {
    position: relative;
  }

  .dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    display: none;
    min-width: 160px;
    background: #fff;
    border: 1px solid #e8e8e8;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    padding: 0.25rem 0;
    z-index: 100;
  }

  .dropdown.open {
    display: block;
  }

  @media (hover: hover) and (pointer: fine) {
    .nav-links li:hover .dropdown,
    .nav-links li:focus-within .dropdown {
      display: block;
    }
  }

  .dropdown a {
    display: block;
    padding: 0.5rem 0.9rem;
    font-size: 12px;
    color: #111;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }

  .dropdown a:hover,
  .dropdown a.active {
    background: #111;
    color: #fff;
  }

  .location-menu > a::after {
    content: '▾';
    display: inline-block;
    margin-left: 0.35rem;
    font-size: 0.8em;
    vertical-align: middle;
  }

  /* GALLERY */
  .gallery {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  /* landscape = 2 cols, portrait = 3 cols */
  .grid-landscape {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    margin-bottom: 0.8rem;
  }
  .grid-portrait {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.8rem;
    margin-bottom: 0.8rem;
  }

  .photo-item {
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .photo-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.25s;
  }
  .photo-item:hover img { opacity: 0.88; }

  .photo-caption {
    font-size: 11px;
    color: #888;
    margin-top: 0.35rem;
    letter-spacing: 0.04em;
    font-style: italic;
    padding-bottom: 0.4rem;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.96);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .lightbox.open { display: flex; }

  .lightbox-inner {
    position: relative;
    max-width: min(90vw, 1000px);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lightbox-inner img {
    max-width: 100%;
    max-height: 82vh;
    object-fit: contain;
    display: block;
  }
  .lightbox-location {
    margin-top: 0.9rem;
    font-size: 12px;
    color: #888;
    font-style: italic;
    letter-spacing: 0.05em;
    text-align: center;
    min-height: 1.2em;
  }
  .lightbox-close {
    position: fixed;
    top: 1.4rem;
    right: 1.8rem;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #111;
    line-height: 1;
    opacity: 0.5;
    transition: opacity 0.2s;
    font-weight: 300;
  }
  .lightbox-close:hover { opacity: 1; }

  .lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #111;
    opacity: 0.35;
    transition: opacity 0.2s;
    padding: 1rem;
    font-weight: 300;
  }
  .lightbox-nav:hover { opacity: 0.9; }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  /* FOOTER */
  footer {
    border-top: 1px solid #e8e8e8;
    padding: 1.4rem 2rem;
    display: flex;
    gap: 1.5rem;
    font-size: 11px;
    color: #888;
  }
  footer a { color: #888; text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: #111; }

  @media (max-width: 700px) {
    .grid-landscape { grid-template-columns: 1fr; }
    .grid-portrait  { grid-template-columns: 1fr 1fr; }
  }
</style>

<script>
  const items = Array.from(document.querySelectorAll('.photo-item'));
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbLoc = document.getElementById('lb-location');
  let current = 0;

  function open(index) {
    current = index;
    const item = items[current];
    lbImg.src = item.querySelector('img').src;
    lbImg.alt = item.querySelector('img').alt;
    lbLoc.textContent = item.dataset.location || '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function prev() { open((current - 1 + items.length) % items.length); }
  function next() { open((current + 1) % items.length); }

  const locationNav = document.getElementById('locationNav');
  const allLocationLabel = 'all';
  const locations = Array.from(new Set(items.map(item => getLocationLabel(item.dataset.location)))).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

  function getLocationLabel(raw) {
    const beforeDash = (raw || '').split('—')[0].trim();
    if (!beforeDash) return '';
    const commaIndex = beforeDash.lastIndexOf(',');
    if (commaIndex !== -1) {
      return beforeDash.slice(commaIndex + 1).trim();
    }
    const parts = beforeDash.split(/\s+/);
    return parts.length > 1 ? parts[parts.length - 1] : beforeDash;
  }

  function getLocationFromHash() {
    const hash = decodeURIComponent(window.location.hash.slice(1));
    const match = hash.match(/^location=(.+)$/);
    return match ? match[1] : allLocationLabel;
  }

  function updateHash(locationName) {
    const hash = locationName && locationName !== allLocationLabel ? `location=${encodeURIComponent(locationName)}` : '';
    history.replaceState(null, '', hash ? `#${hash}` : window.location.pathname + window.location.search);
  }

  function filterItems(locationName) {
    const showAll = locationName === allLocationLabel;
    items.forEach(item => {
      const itemLocation = getLocationLabel(item.dataset.location);
      item.style.display = showAll || itemLocation === locationName ? '' : 'none';
    });
  }

  function renderLocationNav() {
    locationNav.innerHTML = '';
    const allLink = document.createElement('a');
    allLink.href = '#';
    allLink.dataset.location = allLocationLabel;
    allLink.textContent = 'all';
    allLink.addEventListener('click', handleLocationClick);
    locationNav.appendChild(allLink);

    locations.forEach(location => {
      const link = document.createElement('a');
      link.href = `#location=${encodeURIComponent(location)}`;
      link.dataset.location = location;
      link.textContent = location;
      link.addEventListener('click', handleLocationClick);
      locationNav.appendChild(link);
    });
  }

  function handleLocationClick(event) {
    event.preventDefault();
    const locationName = event.currentTarget.dataset.location;
    setActiveLocation(locationName);
    closeLocationDropdown();
  }

  function closeLocationDropdown() {
    locationNav.classList.remove('open');
  }

  function toggleLocationDropdown(event) {
    event.preventDefault();
    locationNav.classList.toggle('open');
  }

  function setActiveLocation(locationName) {
    const links = Array.from(locationNav.querySelectorAll('a'));
    links.forEach(link => link.classList.toggle('active', link.dataset.location === locationName));
    filterItems(locationName);
    updateHash(locationName);
  }

  function initLocationNav() {
    renderLocationNav();
    const initial = getLocationFromHash();
    const available = initial === allLocationLabel || locations.includes(initial) ? initial : allLocationLabel;
    setActiveLocation(available);
  }


  const locationMenuButton = document.querySelector('.location-menu > a');
  locationMenuButton.addEventListener('click', toggleLocationDropdown);

  document.addEventListener('click', (e) => {
    const locationMenu = document.querySelector('.location-menu');
    if (!locationMenu.contains(e.target)) {
      closeLocationDropdown();
    }
  });

  items.forEach((item, i) => item.addEventListener('click', () => open(i)));
  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', prev);
  document.getElementById('lb-next').addEventListener('click', next);

  lb.addEventListener('click', e => { if (e.target === lb) close(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });

  window.addEventListener('hashchange', () => {
    const locationName = getLocationFromHash();
    const available = locationName === allLocationLabel || locations.includes(locationName) ? locationName : allLocationLabel;
    setActiveLocation(available);
  });
  initLocationNav();
</script>
